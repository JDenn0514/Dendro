name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The append-only check reads the published content from main. A default
          # checkout fetches one commit and no main ref, so the check would have
          # nothing to compare against.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # The pipeline runs TypeScript through Node's type stripping, so the
          # repo is on Node 24. `node --test` reads a glob pattern from Node 21.
          node-version: '24'
      - name: Run the tests
        run: node --test "tests/**/*.test.js"
      - name: Validate the live content
        run: node scripts/validate_content.js content
      - name: Validate the fixture content
        run: node scripts/validate_content.js content_dev --local-images content_dev/images
      - name: Fetch the published content
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Check the content ids are append-only
        # A card ID is a foreign key in other people's review logs. Once an ID has
        # shipped it never leaves the content, retired or not.
        run: node pipeline/cli.ts ids check --base origin/main

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only one Pages deploy runs at a time. The check job is free to run in parallel.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # The whole repo root goes up, so pipeline/runs/ and content_src/ are
      # public. That is by design: the run records and the authored species
      # files are meant to be readable. Keys and caches never enter the repo.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
          # .nojekyll is a hidden file. From v5 the upload drops hidden files
          # unless this is set, and without .nojekyll Pages runs the site
          # through Jekyll.
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
